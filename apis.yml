name: Zai Lab
description: 'Zai Lab is an innovative, research-based, commercial-stage biopharmaceutical
  company based in China and the United States, founded in 2014 with headquarters in
  Cambridge, Massachusetts and Shanghai. The company discovers, develops, and commercializes
  transformative medicines for conditions with significant unmet patient needs across
  oncology, immunology, neuroscience, and infectious disease. As a fully integrated
  biopharma, Zai Lab spans early-stage discovery through development, regulatory approval,
  manufacturing, and commercialization. It was surfaced in the API Evangelist network
  as a portfolio company of HongShan and Qiming Venture Partners. Zai Lab publishes
  a corporate and investor web presence but exposes no public developer API surface.'
